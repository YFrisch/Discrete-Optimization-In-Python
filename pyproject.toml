[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discrete-optimization-in-python"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "matplotlib",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
docs = [
    "jupyter-book>=1,<2",
    "pandas",
    "sympy",
]
dev = [
    "black",
    "jupyterlab",
    "nbmake",
    "nbstripout",
    "pre-commit",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
